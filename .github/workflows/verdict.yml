# Avis independant : le workflow est lu sur main (pull_request_target), une PR ne peut donc pas le reecrire.
# Il juge le code de la PR sans secret ni droit d'ecriture (persist-credentials: false, contents: read).
name: verdict
on: pull_request_target
permissions:
  contents: read
jobs:
  verdict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: verification independante
        run: |
          echo "sha juge : $(git rev-parse HEAD)"
          [ "$(bash app.sh)" = "$(cat expected.txt)" ]
          if grep -n FIXME app.sh; then echo "verdict: FIXME"; exit 1; fi
